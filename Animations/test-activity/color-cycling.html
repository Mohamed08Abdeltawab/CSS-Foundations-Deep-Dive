<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button{
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            width: 200px;
            height: 50px;

            animation: colorCycle 5s infinite linear;
        }
        @keyframes colorCycle{
            0%{background-color: #3498db;}
            25%{background-color: #e74c3c;}
            50%{background-color: #f1c40f;}
            75%{background-color: #2ecc71;}
            100%{background-color: #3498db;}
        }
    </style>

</head>
<body>
    <div>
        <button>Colors Cycling</button>
    </div>
</body>
</html>
