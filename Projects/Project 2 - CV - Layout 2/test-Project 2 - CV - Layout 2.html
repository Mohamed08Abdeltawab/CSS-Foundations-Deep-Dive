<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


<style>
    :root{
        --bg: #f5f5f5;
        --sidebar: #333;
        --sidebar-ink: #fff;
        --card: #fff;
        --ink: #333;
        --muted: #666;
        --accent: #007bff;
        --line: #ccc;


        /* shape & depth */
        --radius: 18px;
        --ring: 0 10px 25px rgba(2,6,23,.08);

        /* spacing scale */
        --space-1: 6px; --space-2: 10px; --space-3: 14px;
         --space-4: 20px; --space-5: 28px; --space-6: 40px;


        /* layout caps */
        --sidebar-w: 320px;
        --maxwidth: 1200px;
    }

    :root:has(#themeSwitch:checked){
        --bg: #1a1a1a;
        --sidebar: #111;
        --sidebar-ink: #fff;
        --card: #222;
        --ink: #fff;
        --muted: #aaa;
        --accent: #007bff;
        --line: #444;
        --ring: none;
    }


     @media (prefers-color-scheme: dark) {
      :root:not(:has(#themeSwitch)) {
        --bg:          #0b1220;
        --sidebar:     #075e5e;
        --sidebar-ink: #c9f3f5;
        --card:        #0f172a;
        --ink:         #e5e7eb;
        --muted:       #9aa3b2;
        --accent:      #fb923c;
        --line:        #1f2a44;
        --ring:        none;
      }
    }


</style>

</head>
<body>
    
</body>
</html>
