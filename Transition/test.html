<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
        }

        .button-fade > button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-left: 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            transition: box-shadow 0.4s ease;
        }

        .button-fade > button:hover {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }


        .underline-links{
            margin-top: 30px;
        }

        .underline-links a {
            position: relative;
            color: #e74c3c;
            text-decoration: none;
            font-size: 18px;
        }

        .underline-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            background-color: #e74c3c;
            transition: width 1s ease;
        }

        .underline-links a:hover::after {
            width: 100%;
        }


        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .gallery img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            filter: brightness(.8);
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .gallery img:hover{
            transform: scale(1.05);
            filter: brightness(1);
        }
    </style>


</head>
<body>
    <div class="container">
        <h1>welcome to my gallery</h1>


        <section class="button-fade">
            <h2>Button Fade</h2>
            <button class="fade-button">Hover Me</button>
        </section>

        <section class="underline-links">
            <h2>Underlined Links</h2>
            <a href="#">Hover Over Me</a>
        </section>

        <section class="gallery">
            <h2>Gallery</h2>
            <div class="gallery-images">
                <img src="../images/progile.jpeg" alt="Image 1">
                <img src="../images/progile.jpeg" alt="Image 2">
                <img src="../images/progile.jpeg" alt="Image 3">
                <img src="../images/progile.jpeg" alt="Image 4">
            </div>
        </section>
    </div>
</body>
</html>
