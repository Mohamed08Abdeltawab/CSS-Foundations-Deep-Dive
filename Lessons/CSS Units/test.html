<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


<style>
    html{
        font-size: 16px;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 1em;
        color: white;
    }

    .px-box{
        width: 300px;
        height: 100px;
        margin: 20px auto;
        padding: 10px;

        background: #2196f3;
    }

    .in-box{
        width: 2in;
        height: 1in;
        margin: 20px auto;
        padding: 10px;
        background: #1f9431;
    }

    .cm-box{
        width: 5cm;
        height: 2cm;
        margin: 20px auto;
        padding: 10px;
        background: #b62626;
    }

    .percent-box{
        width: 80%;
        height: 10%;
        margin: 20px auto;
        padding: 10px;
        background: #d2640a;
    }

    .em-box{
        width: 20em;
        padding: 2em;
        margin: 20px auto;
        padding: 10px;
        background: #c608d7;
    }

    .rem-box{
        width: 25rem;
        padding: 1rem;
        margin: 20px auto;
        padding: 10px;
        background: #08d7d0;
    }


    .vw-vh-box{
        width: 50vw;
        height: 20vh;
        margin: 20px auto;
        padding: 10px;
        background: #450f0591;
    }

    .ch-box{
        width: 30ch;
        margin: 20px auto;
        padding: 10px;
        background: #444646;
    }

    .ex-box{
        margin: 4ex;
        height: 10ex;
        margin: 20px auto;
        padding: 10px;
        background: #ff0000;
    }



</style>





</head>
<body>
    

    <div class="px-box">
        Px Box (300px × 100px)
    </div>


    <div class="in-box">
        In Box (2in × 1in)
    </div>


    <div class="cm-box">
        Cm Box (5cm × 2cm)
    </div>

    <div class="percent-box">
        % Box (80% width and 10% height)
    </div>


    <div class="em-box">
        Em Box (20em width, 2em padding)
    </div>

    <div class="rem-box">
        Rem Box (25rem width, 1rem padding)
    </div>

    <div class="vw-vh-box">
        Vw/Vh Box (50vw × 20vh)
    </div>

    <div class="ch-box">
        Ch Box (30ch width)
    </div>


    <div class="ex-box">
        Ex Box (Margin: 4ex, Height: 10ex)
    </div>


</body>
</html>
